name: Strapi CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "public/**"
      - "types/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/zahaanmahajan/strapi-api

jobs:
  ci:
    name: Install and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Strapi repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        run: npm run build

  docker-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Strapi repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"
